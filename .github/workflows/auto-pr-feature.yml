name: Feature Branch PR Automation

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create or Update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verifica se já existe um PR aberto para a branch atual
          PR_EXISTS=$(gh pr list --head "feature/tela-consulta-lotes" --base "develop" --json number --jq '.[0].number')

          if [ -n "$PR_EXISTS" ]; then
            echo "PR #${PR_EXISTS} já existe. Atualizando metadados..."
            # Atualiza o PR existente (ajuste o título e corpo se necessário)
            gh pr edit "$PR_EXISTS" \
              --base develop \
              --head "${{ github.ref_name }}" \
              --title "feat: ${{ github.ref_name }}" \
              --body "PR atualizado automaticamente via CI."
          else
            echo "Nenhum PR encontrado. Criando um novo..."
            # Cria o PR do zero caso não exista
            gh pr create --base develop \
              --head "${{ github.ref_name }}" \
              --title "feat: ${{ github.ref_name }}" \
              --body "PR criado via pipeline."
          fi
