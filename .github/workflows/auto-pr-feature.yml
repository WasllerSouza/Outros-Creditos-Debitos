name: Auto PR Feature

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: write
  pull-requests: write

jobs:

  create-pr:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.MIRANTE_ACTIONS_PAT_SICOOB }}
        run: |

          gh pr create \
            --base develop \
            --head "${{ github.ref_name }}" \
            --title "feat: ${{ github.ref_name }}" \
            --body "PR criado automaticamente."
