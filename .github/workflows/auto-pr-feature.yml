jobs:
  create-pr:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          base: develop
          branch: ${{ github.ref_name }}
          title: "feat: ${{ github.ref_name }}"
          body: |
            PR criado automaticamente.
