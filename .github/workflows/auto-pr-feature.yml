name: Feature Branch PR Automation

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create or Update PR
        env:
          GH_TOKEN: ${{ secrets.MIRANTE_ACTIONS_PAT_SICOOB }}
        run: |
          # Captura o nome da branch atual que disparou o push dinamicamente
          CURRENT_BRANCH="${{ github.ref_name }}"

          # Verifica se já existe um PR aberto para a branch atual para develop
          PR_EXISTS=$(gh pr list --head "$CURRENT_BRANCH" --base "develop" --json number --jq '.[0].number' 2>/dev/null)

          if [ -n "$PR_EXISTS" ] && [ "$PR_EXISTS" != "null" ]; then
            echo "PR #${PR_EXISTS} já existe. Atualizando metadados..."

            # REMOVIDO A FLAG --head QUE CAUSAVA O ERRO
            gh pr edit "$PR_EXISTS" \
              --base develop \
              --title "feat: $CURRENT_BRANCH" \
              --body "PR atualizado automaticamente via CI."
          else
            echo "Nenhum PR encontrado. Criando um novo..."

            gh pr create \
              --base develop \
              --head "$CURRENT_BRANCH" \
              --title "feat: $CURRENT_BRANCH" \
              --body "PR criado via pipeline."
          fi
