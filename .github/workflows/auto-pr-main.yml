name: Auto PR Develop -> Main

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.MIRANTE_ACTIONS_PAT_SICOOB }}
          base: main
          branch: develop
          title: "release: develop -> main"
          body: |
            PR automático para produção.
          draft: false
