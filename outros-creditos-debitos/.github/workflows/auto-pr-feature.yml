name: Auto PR Feature -> Develop

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.MIRANTE_ACTIONS_PAT_SICOOB }}
          base: develop
          branch: ${{ github.ref_name }}
          title: "feat: ${{ github.ref_name }}"
          body: |
            Pull Request criado automaticamente.

            Origem: `${{ github.ref_name }}`
            Destino: `develop`
          draft: false
